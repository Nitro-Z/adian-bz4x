<!doctype html>
<html lang="zh-TW"><head><meta charset="utf-8">
<!-- v7 demo video: two motion-graphic scenes rendered frame by frame by render_scenes_v7.py.
     ?scene=intro  : 陳先生 on top of the landing page, worrying where to charge (before he opens 阿電)
     ?scene=bridge : the things he said in the chat fly onto the real map (verdict → simulation)
     window.renderAt(t) draws the scene at time t (seconds); nothing animates by itself. -->
<style>
:root { --ink:#141B2D; --green:#27F550; --yellow:#FFD84D; }
* { box-sizing:border-box; margin:0; padding:0; }
html,body { width:1920px; height:1080px; overflow:hidden; background:#000;
  font-family:"Noto Sans CJK TC","Noto Color Emoji",sans-serif; color:var(--ink); }
#bg { position:absolute; inset:-30px; background-size:cover; background-position:center; }
#dim { position:absolute; inset:0; background:var(--ink); opacity:0; }
.card { position:absolute; background:#fff; border:6px solid var(--ink); border-radius:28px;
  box-shadow:12px 12px 0 var(--ink); }
#title { left:50%; top:70px; padding:26px 48px; font-size:68px; font-weight:900; white-space:nowrap;
  transform-origin:50% 50%; }
#title b { background:var(--green); padding:0 10px; border-radius:10px; }
#chen { position:absolute; left:470px; bottom:-10px; height:700px; transform-origin:50% 100%; }
.q { position:absolute; font-size:120px; font-weight:900; color:var(--ink);
  text-shadow:5px 5px 0 #fff, -3px -3px 0 #fff, 3px -3px 0 #fff, -3px 3px 0 #fff; }
#bubble { left:900px; top:330px; width:880px; padding:34px 44px; font-size:54px; font-weight:900; line-height:1.35; }
#bubble .tail1, #bubble .tail2 { position:absolute; background:#fff; border:6px solid var(--ink); border-radius:50%; }
#bubble .tail1 { width:56px; height:56px; left:-70px; top:150px; }
#bubble .tail2 { width:32px; height:32px; left:-118px; top:212px; }
#bubble .ln { display:block; }
#bubble .ln2 { color:#0a7a2a; }
.chips { display:flex; gap:20px; margin-top:22px; }
.chip { display:inline-block; background:var(--yellow); border:5px solid var(--ink); border-radius:999px;
  padding:10px 24px; font-size:34px; font-weight:900; box-shadow:6px 6px 0 var(--ink); white-space:nowrap; }
/* bridge */
#said { left:90px; top:230px; width:760px; padding:34px 40px 40px; }
#said h3 { font-size:44px; font-weight:900; margin-bottom:22px; }
.fly { position:absolute; left:0; top:0; background:#fff; border:5px solid var(--ink); border-radius:22px;
  padding:14px 26px; font-size:42px; font-weight:900; box-shadow:7px 7px 0 var(--ink); white-space:nowrap;
  transform-origin:0 0; }
.fly .k { background:var(--green); border-radius:8px; padding:0 8px; }
.ring { position:absolute; width:120px; height:120px; margin:-60px 0 0 -60px; border:8px solid var(--green);
  border-radius:50%; opacity:0; }
#btitle { left:50%; top:96px; padding:20px 44px; font-size:58px; font-weight:900; background:var(--yellow);
  white-space:nowrap; }
</style></head>
<body>
<div id="bg"></div><div id="dim"></div>
<div id="stage"></div>
<script>
const P = new URLSearchParams(location.search), SCENE = P.get('scene') || 'intro';
const $ = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); const e = d.firstChild; document.getElementById('stage').appendChild(e); return e; };
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lin = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const easeInOut = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const pop = (t, a, d = .45) => { const x = lin(t, a, a + d); return x <= 0 ? 0 : back(x); };
const bg = document.getElementById('bg'), dim = document.getElementById('dim');

if (SCENE === 'intro') {
  bg.style.backgroundImage = 'url(land.jpg)';
  var title = $('<div class="card" id="title">家裡不能充電，<b>電動車適合我嗎？</b></div>');
  var chen = $('<img id="chen" src="dad.png">');
  var qs = [[700, 270, 1.35, -12], [820, 190, 1.6, 8], [600, 200, 1.85, -4]].map(([x, y, at, r]) => {
    const e = $('<div class="q">?</div>'); e.style.left = x + 'px'; e.style.top = y + 'px'; return { e, at, r }; });
  var bubble = $('<div class="card" id="bubble"><i class="tail1"></i><i class="tail2"></i>' +
    '<span class="ln ln1">「我家不能裝充電樁…</span><span class="ln ln2">那我要去哪裡充電？」</span>' +
    '<div class="chips"><span class="chip c1">🔋 電池能用多久？</span><span class="chip c2">🤔 生活會變麻煩嗎？</span></div></div>');
  var ln1 = bubble.querySelector('.ln1'), ln2 = bubble.querySelector('.ln2'), c1 = bubble.querySelector('.c1'), c2 = bubble.querySelector('.c2');
  window.DURATION = 7.4;
  window.renderAt = (t) => {
    const out = easeInOut(lin(t, 6.2, 7.2));          // everything leaves, the landing page stays
    bg.style.filter = `blur(${(7 * (1 - out)) * lin(t, 0, .5)}px)`;
    dim.style.opacity = .38 * lin(t, 0, .5) * (1 - out);
    const ts = pop(t, .25);
    title.style.transform = `translate(-50%,0) scale(${ts})`; title.style.opacity = (ts > 0 ? 1 : 0) * (1 - out);
    const cy = (1 - easeOut(lin(t, .5, 1.2))) * 760 + Math.sin(t * 2.2) * 5;
    chen.style.transform = `translateY(${cy + out * 760}px) rotate(${Math.sin(t * 1.6) * 1.2}deg)`;
    qs.forEach(({ e, at, r }, i) => {
      const s = pop(t, at, .35);
      e.style.opacity = (s > 0 ? 1 : 0) * (1 - out);
      e.style.transform = `translateY(${Math.sin(t * 3 + i) * 10}px) rotate(${r + Math.sin(t * 2 + i) * 6}deg) scale(${s})`;
    });
    const bs = pop(t, 1.5, .45);
    bubble.style.opacity = (bs > 0 ? 1 : 0) * (1 - out); bubble.style.transform = `scale(${bs})`; bubble.style.transformOrigin = '0 60%';
    ln1.style.opacity = lin(t, 1.7, 2.0); ln2.style.opacity = lin(t, 2.6, 2.9);
    const s1 = pop(t, 3.5, .35), s2 = pop(t, 3.85, .35);
    c1.style.transform = `scale(${s1})`; c2.style.transform = `scale(${s2})`;
  };
} else {
  bg.style.backgroundImage = 'url(map0.jpg)'; bg.style.inset = '0';
  var said = $('<div class="card" id="said"><h3>🎤 陳先生剛剛說：</h3></div>');
  // [text html, target x, y] targets sit next to the pins on the first sim frame
  const items = [['🏢 平日：往<span class="k">信義區</span>上班 ↑', 985, 225],
                 ['📚 下午：接小孩去<span class="k">補習班</span>', 1060, 545],
                 ['🛍️ 週末：<span class="k">公園、逛街</span>', 1222, 305],
                 ['🔌 家裡、公司：<span class="k">不能充電</span>', 600, 600]];
  var flies = items.map(([h, x, y], i) => {
    const e = $(`<div class="fly">${h}</div>`); const r = $('<div class="ring"></div>');
    return { e, r, x, y, sx: 140, sy: 340 + i * 112, at: .45 + i * .32, go: 2.5 + i * .18 };
  });
  var bt = $('<div class="card" id="btitle">把他說的一週，放到真實的地圖上</div>');
  const SHORT = P.get('short') === '1';
  window.DURATION = SHORT ? 4.2 : 7.6;
  const draw = (t) => {
    const clear = easeInOut(lin(t, 2.6, 4.2));
    bg.style.filter = `blur(${8 * lin(t, 0, .4) * (1 - clear)}px)`;
    dim.style.opacity = .42 * lin(t, 0, .4) * (1 - clear);
    const ss = pop(t, .1, .4);
    said.style.transform = `scale(${ss})`; said.style.transformOrigin = '0 0';
    said.style.opacity = (ss > 0 ? 1 : 0) * (1 - lin(t, 2.5, 3.0));
    said.style.height = '560px';
    flies.forEach(({ e, r, x, y, sx, sy, at, go }) => {
      const a = pop(t, at, .35), f = easeInOut(lin(t, go, go + 1.1));
      const px = sx + (x - sx) * f, py = sy + (y - sy) * f - Math.sin(f * Math.PI) * 90;
      const sc = (1 - .22 * f) * (f > 0 ? 1 : a);
      e.style.opacity = a > 0 ? 1 : 0;
      e.style.transform = `translate(${px}px,${py}px) scale(${sc})`;
      const rr = lin(t, go + 1.1, go + 1.9);
      r.style.left = x + 'px'; r.style.top = (y + 32) + 'px';
      r.style.opacity = rr > 0 && rr < 1 ? 1 - rr : 0; r.style.transform = `scale(${.4 + rr * 1.6})`;
    });
    const b = pop(t, 4.3, .45);
    bt.style.opacity = b > 0 ? 1 : 0; bt.style.transform = `translate(-50%,0) scale(${b})`;
  };
  window.renderAt = (t) => draw(!SHORT ? t : t < 2.4 ? t * 1.9 : 4.56 + (t - 2.4));
}
window.renderAt(0);
</script>
</body></html>
